{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faturale</title>
  <link rel="icon" href="{% static 'faturamento/logo-f.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'faturamento/styles.css' %}?v={{ versao }}">
</head>
<body>
  <section id="tela-login" class="login oculto">
    <div class="login-caixa">
      <img src="{% static 'faturamento/logo-f.png' %}" alt="">
      <div class="marca-nome">FATURALE</div>
      <div class="marca-sub">CONSULTORIA EM SAÚDE</div>

      <div class="entrada">
        <div class="entrada-titulo" id="entrada-titulo">
          <span class="avatar-login" role="img" aria-label="Entrar">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="av-fundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc4ff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient>
                <clipPath id="av-corte"><circle cx="32" cy="32" r="30"/></clipPath>
              </defs>
              <circle cx="32" cy="32" r="30" fill="url(#av-fundo)"/>
              <g clip-path="url(#av-corte)" fill="#fff">
                <circle cx="32" cy="25" r="10.5"/>
                <path d="M12 58c0-12 9-20 20-20s20 8 20 20v8H12z"/>
              </g>
            </svg>
          </span>
          <span class="entrada-titulo-texto oculto">Primeiro acesso</span>
        </div>

        <form id="form-login">
          <div class="campo"><label for="login">Usuário</label><input id="login" autocomplete="username" required placeholder="ex.: fabricio.alves"></div>
          <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required placeholder="sua senha"></div>
          <button class="btn btn-primario" style="width:100%;justify-content:center">Entrar</button>
          <p class="entrada-troca">Primeiro acesso? <button type="button" data-entrada="cadastro">Cadastre-se</button></p>
        </form>

        <form id="form-cadastro" class="oculto">
          <div class="campo"><label>Nome e sobrenome</label><input name="nome" required maxlength="80" autocomplete="name" placeholder="ex.: Fabrício Alves" pattern=".*\S+\s+\S+.*" title="Escreva o nome e o sobrenome"></div>
          <div class="campo"><label>Usuário (nome.sobrenome)</label><input name="login" required maxlength="30" pattern="[a-z0-9]+(\.[a-z0-9]+)+" title="nome.sobrenome, letras minúsculas sem acento (ex.: fabricio.alves)" placeholder="ex.: fabricio.alves" autocomplete="username"></div>
          <div class="campo"><label>E-mail</label><input name="email" type="email" maxlength="120" autocomplete="email" placeholder="ex.: fabricio.alves@gmail.com"></div>
          <div class="campo"><label>Senha</label><input name="senha" type="password" minlength="6" required autocomplete="new-password" placeholder="mínimo 6 caracteres"></div>
          <div class="campo"><label>Repita a senha</label><input name="confirmacao" type="password" minlength="6" required autocomplete="new-password" placeholder="digite a senha de novo"></div>
          <fieldset class="pergunta-faturista">
            <legend>Você é faturista?</legend>
            <label><input type="radio" name="faturista" value="sim" required> Sim</label>
            <label><input type="radio" name="faturista" value="nao"> Não</label>
          </fieldset>
          <button class="btn btn-primario" style="width:100%;justify-content:center">Cadastrar</button>
          <p class="entrada-nota">Faturista entra na hora. Se não for, a coordenação escolhe o seu perfil e libera o acesso.</p>
          <p class="entrada-troca">Já tem cadastro? <button type="button" data-entrada="entrar">Entrar</button></p>
        </form>
        <p class="ok-login oculto" id="ok-cadastro"></p>
      </div>
      <p class="erro" id="erro-login"></p>
      <button type="button" class="link-publico" data-publico>Consultar convênios e calendário sem login</button>
    </div>
  </section>

  <section id="tela-app" class="app oculto">
    <aside class="lateral">
      <div class="marca">
        <img src="{% static 'faturamento/logo-f.png' %}" alt="">
        <div><b>FATURALE</b><span>CONSULTORIA EM SAÚDE</span></div>
      </div>
      <nav id="abas"></nav>
      <div class="usuario"><div><span id="nome-usuario"></span><small id="perfil-usuario"></small></div><button id="minha-senha" class="oculto">Trocar senha</button><button id="sair">Sair</button></div>
    </aside>
    <main><div id="alertas"></div><div id="conteudo"></div></main>
  </section>

  <script type="module" src="{% static 'faturamento/app.js' %}?v={{ versao }}"></script>
</body>
</html>
