<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faturale · demonstração</title>
  <link rel="icon" href="logo-f.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1794508033">
</head>
<body>
  <section id="tela-login" class="login oculto">
    <div class="login-caixa">
      <img src="logo-f.png" alt="">
      <div class="marca-nome">FATURALE</div>
      <div class="marca-sub">CONSULTORIA EM SAÚDE</div>

      <!-- Modo demonstração: entra escolhendo a pessoa, sem senha -->
      <div class="escolher oculto" id="escolher">
        <p>Quem está entrando?</p>
        <div class="pessoas"></div>
        <small>Modo demonstração · acesso sem senha</small>
      </div>

      <form id="form-login" class="oculto">
        <div class="campo"><label for="login">Usuário</label><input id="login" autocomplete="username" required></div>
        <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primario" style="width:100%;justify-content:center">Entrar</button>
      </form>
      <p class="erro" id="erro-login"></p>
    </div>
  </section>

  <section id="tela-app" class="app oculto">
    <aside class="lateral">
      <div class="marca">
        <img src="logo-f.png" alt="">
        <div><b>FATURALE</b><span>CONSULTORIA EM SAÚDE</span></div>
      </div>
      <nav id="abas"></nav>
      <div class="usuario"><div><span id="nome-usuario"></span><small id="perfil-usuario"></small></div><button id="minha-senha" class="oculto">Trocar senha</button><button id="sair">Sair</button></div>
    </aside>
    <main><div id="alertas"></div><div id="conteudo"></div></main>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="demo-api.js?v=1794508033"></script>
  <script type="module" src="app.js?v=1794508033"></script>
</body>
</html>
